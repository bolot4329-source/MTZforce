name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Ключ подписи не хранится в репозитории. Если в настройках репозитория
      # заданы секреты (Settings → Secrets and variables → Actions):
      #   FORGE_KEYSTORE_BASE64, FORGE_STORE_PASSWORD, FORGE_KEY_ALIAS, FORGE_KEY_PASSWORD
      # — APK подпишется релизным ключом. Иначе — debug-подписью.
      - name: Decode signing keystore
        env:
          FORGE_KEYSTORE_BASE64: ${{ secrets.FORGE_KEYSTORE_BASE64 }}
          FORGE_STORE_PASSWORD: ${{ secrets.FORGE_STORE_PASSWORD }}
          FORGE_KEY_ALIAS: ${{ secrets.FORGE_KEY_ALIAS }}
          FORGE_KEY_PASSWORD: ${{ secrets.FORGE_KEY_PASSWORD }}
        run: |
          if [ -n "$FORGE_KEYSTORE_BASE64" ]; then
            mkdir -p keystore
            printf '%s' "$FORGE_KEYSTORE_BASE64" | base64 -d > keystore/forge.keystore
            {
              echo "FORGE_KEYSTORE_FILE=$PWD/keystore/forge.keystore"
              echo "FORGE_STORE_PASSWORD=$FORGE_STORE_PASSWORD"
              echo "FORGE_KEY_ALIAS=$FORGE_KEY_ALIAS"
              echo "FORGE_KEY_PASSWORD=$FORGE_KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Релизный ключ загружен из секретов"
          else
            echo "Секреты подписи не заданы — APK будет подписан debug-ключом"
          fi

      - name: Build
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/MtzForge-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MtzForge-apk
          path: out/*.apk
